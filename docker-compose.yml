services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: siti_portfolio
      MYSQL_USER: siti
      MYSQL_PASSWORD: change-me-locally
      MYSQL_ROOT_PASSWORD: change-me-locally
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-me-locally"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
